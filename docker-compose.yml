services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: aims
      POSTGRES_DB: aims
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aims -d aims"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: runtime
    image: aims-rag-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    image: aims-rag-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "${WEB_PORT:-80}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  indexer:
    image: aims-rag-api:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "main.py", "index"]

volumes:
  pgdata:
